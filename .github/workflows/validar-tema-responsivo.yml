name: Validar tema Blogger responsivo
on:
  push:
    branches: [feature/menu-responsivo-categorias]
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:blogger
      - name: Validar XML e navegação
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          path=Path('blogger/downloads/RN-Grafica-Rapida-Blogger.xml')
          assert path.is_file() and path.stat().st_size > 10000
          xml=path.read_text(encoding='utf-8')
          root=ET.fromstring(xml)
          assert root.tag.endswith('html')
          assert "xmlns:b=" in xml
          assert "b:skin" in xml
          assert "Blog1" in xml
          for item in ('Serviços','Ferramentas','Informações','Editor de fotos online','nav-submenu','Todos os serviços'):
              assert item in xml, f'Falta: {item}'
          assert 'Calculadora gráfica' not in xml
          assert 'data-rn-calculator' not in xml
          assert 'Imprima suas ideias.' not in xml
          print(f'XML bem formado, {path.stat().st_size} bytes; catálogo e menus presentes, sem calculadora ou hero antigo.')
          PY
      - name: Testes automatizados
        run: |
          node --test tests/*.test.mjs
      - name: Guardar tema para instalação
        uses: actions/upload-artifact@v4
        with:
          name: RN-Grafica-Tema-Blogger-Responsivo
          path: |
            blogger/downloads/RN-Grafica-Rapida-Blogger.xml
            blogger/downloads/RN-Grafica-Rapida-Blogger.zip
          if-no-files-found: error
